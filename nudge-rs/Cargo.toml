[package]
name = "nudge"
# Load-bearing, not release hygiene: `crate::VERSION` is this string, and the
# CLI/daemon handshake adopts any resident daemon reporting the same one. 0.1.0
# predates `JobSpec::verify_fingerprint`/`verify_dims`, which serde drops
# silently from a Schedule it does not know — so a 0.1.0 daemon adopted by this
# build would run the old banner-only `--verify` and report success doing it.
# Bump this whenever the IPC wire format or the daemon's behavior changes.
# 0.2.0 predates the weekly banner. run_injection calls detect_reset at fire
# time, so a 0.2.0 daemon adopted by this build would not recognize a weekly
# banner, would report SkippedNoBanner, and the nudge would silently never
# fire -- the failure this comment exists to prevent, via a path that is not
# the wire format.
# 0.4.0 adds the client-side TUI dashboard: no wire/daemon change, so this bump
# is a feature marker, not compat-load-bearing like the ones above.
# 0.5.0 adds the Codex banner, and is load-bearing the way 0.3.0 was: a 0.4.0
# daemon does not know that banner either, and under --verify would skip it. It
# also presses Enter too soon after the text for Codex, which leaves the
# message sitting in the composer, unsent.
# 0.6.0 is load-bearing for the daemon's behavior: a 0.5.0 daemon types into a
# Claude Code box left in Vim Normal mode as it is, so the nudge arrives as
# commands, and logs a message stuck unsent in the box as Sent. (It fires the
# pane ids this build stores without trouble.)
# 0.7.0 is load-bearing the same way: a 0.6.0 daemon drops a Schedule's
# `server` stamp silently, so it would fire a job into whichever pane took its
# id after a tmux restart. It also presses `i` for Codex's Normal mode, not `A`.
version = "0.7.0"
edition = "2024"
description = "Rate-limit auto-resumer for AI CLIs in tmux"
license = "GPL-3.0-or-later"

[[bin]]
name = "nudge"
path = "src/main.rs"

[lib]
name = "nudge"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
strip-ansi-escapes = "0.2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
plist = "1"
notify-rust = "4"
inquire = "0.7"
fs4 = "0.13"
ratatui = "0.30.2"
crossterm = "0.29.0"
ansi-to-tui = "8.0.1"

[dev-dependencies]
tempfile = "3"

# CI gates on `cargo clippy --all-targets -- -D warnings`, so everything left at
# `warn` here is effectively deny. The allows below are lints whose cost here is
# churn, not correctness -- each one was measured against this tree, not assumed.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# nudge ships a binary. `pub` marks the CLI/daemon seam between this crate's own
# modules, not an API anyone downstream calls, so the three doc/attribute lints
# aimed at library authors would add ~90 annotations that no caller ever reads.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
