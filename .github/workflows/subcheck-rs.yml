name: subcheck-rs

# The same shape as nudge-rs.yml, for the other crate. Makefile is in the filter
# for the same reason it is there: it drives cargo for this crate too
# (build-subcheck, check, distclean), so editing it can break the build without
# touching subcheck-rs/.
on:
  push:
    paths: ['subcheck-rs/**', 'Makefile', '.github/workflows/subcheck-rs.yml']
  pull_request:
    paths: ['subcheck-rs/**', 'Makefile', '.github/workflows/subcheck-rs.yml']

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: subcheck-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The `apply` tests remux with mkvmerge: installed on Linux and required
      # there (SUBCHECK_NEED_MKVMERGE), left out on macOS, where they skip. The
      # other tests read MKV fixtures committed under tests/fixtures/.
      - name: Install mkvtoolnix
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mkvtoolnix
      #
      # Keep these three in step with the subcheck-rs job in
      # .forgejo/workflows/ci.yml, which runs them with --manifest-path.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          SUBCHECK_NEED_MKVMERGE: ${{ runner.os == 'Linux' && '1' || '' }}
