name: nudge-rs

# Makefile is in the filter because it drives cargo (build-nudge, check,
# distclean all shell out to it): editing it can break the Rust build without
# touching a single file under nudge-rs/, and the filter as written skipped the
# whole workflow in that case.
on:
  push:
    paths: ['nudge-rs/**', 'Makefile', '.github/workflows/nudge-rs.yml']
  pull_request:
    paths: ['nudge-rs/**', 'Makefile', '.github/workflows/nudge-rs.yml']

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: nudge-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install tmux
      # Keep these three in step with .forgejo/workflows/ci.yml: the Forgejo
      # gate runs the same three commands with --manifest-path, and a flag added
      # to one file but not the other silently narrows a gate on one host only.
      # --all-targets is what makes clippy see tests/ and benches/, not just the
      # lib and bin.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
